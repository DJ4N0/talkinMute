
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ed1824">
<title>Message Screen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#ed1824}
.screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;overflow:hidden}
#displayText{font-size:76px;font-weight:900;color:white;line-height:1.1;white-space:pre-wrap;overflow-wrap:anywhere}
#exitBtn{position:fixed;top:7px;right:7px;width:35px;height:35px;padding:0;border:0;background:#ffffff65;color:#111;border-radius:5px;font-size:25px;font-weight:normal;opacity:.35;z-index:5}
#exitBtn:active{opacity:1}
.screen.scrolling{justify-content:flex-start}
.screen.scrolling #displayText{width:max-content;max-width:none;white-space:nowrap;animation:marquee 15s linear infinite}
@keyframes marquee{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
#messageStatus{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#fff9;font-size:12px}
@media(max-width:750px){.screen{padding:15px}#displayText{font-size:min(15vw,76px)}}
</style>
</head>
<body>

<div class="screen" id="screen">
<div id="displayText">hello</div>
</div>

<button id="exitBtn" aria-label="Esci">×</button>
<div id="messageStatus"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./app.js"></script>
</body>
</html>
